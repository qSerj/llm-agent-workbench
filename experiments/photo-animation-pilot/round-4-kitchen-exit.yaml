# Первая половина мотивированного перехода 4→5: действие завершается уходом из кухни.
id: photo-animation-kitchen-exit-pilot
budget_usd: 0.08
jobs:
  - id: kitchen-leave-spoon-and-exit
    case: kitchen-exit
    model: bytedance/seedance-1-5-pro
    first_frame: inbound/4.png
    duration: 4
    size: 480x640
    generate_audio: false
    seed: 4201
    prompt: >-
      Preserve the exact identity, young age, face, hairstyle, blue dress,
      kitchen, table, enamel pot, spoon, hands, and archival family-photo look.
      Direct one continuous realistic shot with clear timing. For roughly the
      first two seconds the little girl remains beside the table, gently stirs
      the pot once, smiles subtly, then deliberately leaves the spoon resting
