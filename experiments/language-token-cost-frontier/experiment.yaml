# Второй круг языкового опыта: две сильные модели при неизменной задаче.

id: language-token-cost-frontier-task01
question: >-
  Сохраняется ли измеренный перерасход русской постановки на GPT-5.6 Terra и
  Claude Sonnet 4.6 при одинаковом качестве решения?

workspace: experiments/language-token-cost/workspace
task: task-03-collapse-integer-ranges
case: collapse-ranges-fixture
repetitions: 5

evaluate:
  suite:
    path: experiments/language-token-cost/checks
    command: [python3, run_checks.py]
    timeout: 120

candidates:
  - id: terra-ru
    stages:
      - role: SOLVER
        model: openai/gpt-5.6-terra
        prompt: experiments/language-token-cost/task.ru.md
        allow_edit: [ranges.py]
        allow_bash: [python3*]

  - id: terra-en
    stages:
      - role: SOLVER
        model: openai/gpt-5.6-terra
        prompt: experiments/language-token-cost/task.en.md
        allow_edit: [ranges.py]
        allow_bash: [python3*]

  - id: sonnet-ru
    stages:
      - role: SOLVER
        model: anthropic/claude-sonnet-4.6
        prompt: experiments/language-token-cost/task.ru.md
        allow_edit: [ranges.py]
        allow_bash: [python3*]

  - id: sonnet-en
    stages:
      - role: SOLVER
        model: anthropic/claude-sonnet-4.6
        prompt: experiments/language-token-cost/task.en.md
        allow_edit: [ranges.py]
        allow_bash: [python3*]
