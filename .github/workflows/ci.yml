name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile run_agent.py grade.py tests/test_run_agent.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build fixture
        run: dotnet build fixture/InterleaverBench.sln --configuration Release --nologo -m:1
