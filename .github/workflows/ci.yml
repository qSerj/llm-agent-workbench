name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile run_agent.py grade.py workbench/envelope.py workbench/mlflow_projection.py workbench/otel_projection.py tools/legacy_opencode_to_envelope.py tools/envelope_to_mlflow.py tools/envelope_to_otlp.py tools/run_opencode_stage.py tools/check_markdown_citations.py examples/audio_conversion/run.py tests/test_run_agent.py tests/test_envelope.py tests/test_otel_projection.py tests/test_markdown_citations.py tests/test_opencode_stage.py

      - name: Install envelope validator
        run: python -m pip install -r requirements-envelope.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build fixture
        run: dotnet build fixture/InterleaverBench.sln --configuration Release --nologo -m:1
