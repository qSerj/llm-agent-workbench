name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile workbench/*.py tools/*.py examples/audio_conversion/run.py tests/*.py

      - name: Install lab dependencies
        run: python -m pip install -r requirements-lab.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
